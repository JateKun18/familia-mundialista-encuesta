<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Vota — Familia Mundialista</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  body{background:linear-gradient(170deg,#001233 0%,#002D72 60%,#001840 100%);color:#fff;font-family:'Exo 2',sans-serif;height:100svh;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent;}
  .top{text-align:center;padding:22px 20px 10px;flex-shrink:0;}
  .balon{font-size:2rem;display:block;margin-bottom:6px;}
  .tag{font-size:0.72rem;letter-spacing:3px;color:#FFD700;font-weight:700;text-transform:uppercase;}
  .pregunta{text-align:center;padding:0 22px 12px;flex-shrink:0;}
  .pregunta h1{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;line-height:1.1;letter-spacing:1.5px;text-shadow:0 2px 12px rgba(0,0,0,0.5);}
  .pregunta h1 .ec{color:#FFD700;}
  .sub{font-size:0.75rem;color:rgba(255,255,255,0.4);margin-top:6px;letter-spacing:1px;}
  .botones{flex:1;display:grid;grid-template-rows:1fr 1fr;gap:12px;padding:0 18px 22px;}
  .btn-v{border:none;border-radius:22px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:'Bebas Neue',sans-serif;letter-spacing:4px;transition:transform 0.12s,filter 0.12s;position:relative;overflow:hidden;user-select:none;-webkit-user-select:none;}
  .btn-v::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,0.18) 0%,transparent 60%);border-radius:inherit;}
  .btn-v:active{transform:scale(0.95);filter:brightness(0.85);}
  .btn-si{background:linear-gradient(145deg,#1e8449,#27AE60,#2ECC71);box-shadow:0 8px 40px rgba(46,204,113,0.5);}
  .btn-no{background:linear-gradient(145deg,#922B21,#C0392B,#E74C3C);box-shadow:0 8px 40px rgba(231,76,60,0.5);}
  .btn-icon{font-size:3rem;display:block;}
  .btn-label{font-size:3rem;display:block;}
  .btn-sub{font-size:0.72rem;font-family:'Exo 2',sans-serif;font-weight:700;letter-spacing:2px;opacity:0.75;display:block;}
  .pie{text-align:center;font-size:0.68rem;color:rgba(255,255,255,0.2);padding:0 0 8px;flex-shrink:0;}

  /* Pantalla ya votó */
  #p-ya{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;flex:1;padding:28px;gap:10px;}
  #p-ya .ic{font-size:3.8rem;}
  #p-ya h2{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:3px;color:#FFD700;}
  #p-ya p{font-size:0.9rem;color:rgba(255,255,255,0.6);line-height:1.6;}

  /* Pantalla OK */
  #p-ok{display:none;position:fixed;inset:0;z-index:100;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:14px;animation:fadeIn 0.4s ease-out;}
  #p-ok.si-bg{background:linear-gradient(170deg,#0D4A2A,#1a8f4e);}
  #p-ok.no-bg{background:linear-gradient(170deg,#4A0D0D,#8f1a1a);}
  @keyframes fadeIn{from{opacity:0;transform:scale(0.92)}to{opacity:1;transform:scale(1)}}
  #p-ok .ok-ic{font-size:4.5rem;animation:pop 0.5s cubic-bezier(0.36,0.07,0.19,0.97);}
  @keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
  #p-ok h2{font-family:'Bebas Neue',sans-serif;font-size:2.4rem;letter-spacing:4px;}
  #p-ok .ok-voto{font-family:'Bebas Neue',sans-serif;font-size:3.8rem;letter-spacing:5px;color:#FFD700;text-shadow:0 0 30px rgba(255,215,0,0.7);}
  #p-ok .ok-sub{font-size:0.85rem;color:rgba(255,255,255,0.7);letter-spacing:1px;}
  .balones-row{font-size:1.8rem;letter-spacing:10px;}

  /* Loading */
  .loading{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;align-items:center;justify-content:center;font-size:3.5rem;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- Pantalla principal -->
<div id="p-main" style="display:flex;flex-direction:column;height:100svh;">
  <div class="top">
    <span class="balon">⚽</span>
    <div class="tag">Familia Mundialista</div>
  </div>
  <div class="pregunta">
    <h1>¿QUISIERAS VER EL PARTIDO DE <span class="ec">ECUADOR</span> EN LA PANTALLA GRANDE?</h1>
    <p class="sub">Solo puedes votar una vez</p>
  </div>
  <div class="botones">
    <button class="btn-v btn-si" id="btn-si" onclick="votar('si')">
      <span class="btn-icon">✅</span>
      <span class="btn-label">SÍ</span>
      <span class="btn-sub">¡QUIERO VERLO!</span>
    </button>
    <button class="btn-v btn-no" id="btn-no" onclick="votar('no')">
      <span class="btn-icon">❌</span>
      <span class="btn-label">NO</span>
      <span class="btn-sub">NO, GRACIAS</span>
    </button>
  </div>
  <div class="pie">⚽ Voto anónimo · Un voto por persona</div>
</div>

<!-- Ya votó -->
<div id="p-ya">
  <div class="ic">⚽</div>
  <h2>¡YA VOTASTE!</h2>
  <p>Ya registramos tu voto.<br>Solo se permite un voto por persona.</p>
</div>

<!-- Confirmación -->
<div id="p-ok">
  <div class="ok-ic">⚽</div>
  <h2>¡VOTO REGISTRADO!</h2>
  <div class="ok-voto" id="ok-label"></div>
  <div class="ok-sub">Tu voto está siendo contado en tiempo real</div>
  <div class="balones-row">⚽ ⚽ ⚽</div>
</div>

<!-- Cargando -->
<div class="loading" id="loading">⚽</div>

<script>
// ═══════════════════════════════════════════
//  CONFIGURACION FIREBASE
// ═══════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyC4hi8x8U6kRzeaTZXd1_Yb5lK4axwHHNI",
  authDomain: "familia-encuesta-mundial.firebaseapp.com",
  databaseURL: "https://familia-encuesta-mundial-default-rtdb.firebaseio.com",
  projectId: "familia-encuesta-mundial",
  storageBucket: "familia-encuesta-mundial.firebasestorage.app",
  messagingSenderId: "682913863910",
  appId: "1:682913863910:web:d228b84bbe92edf82b8327"
};
// ═══════════════════════════════════════════

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function getToken() {
  let t = localStorage.getItem('fm_token_v2');
  if (!t) {
    t = 'fm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 11);
    localStorage.setItem('fm_token_v2', t);
  }
  return t;
}

// Clave de voto depende de la ronda actual
// Al resetear, la ronda sube → localStorage no coincide → pueden volver a votar
let rondaActual = 1;

async function iniciar() {
  const snap = await db.ref('encuesta/ronda').once('value');
  rondaActual = snap.val() || 1;
  const claveRonda = 'fm_voto_r' + rondaActual;

  if (localStorage.getItem(claveRonda)) {
    document.getElementById('p-main').style.display = 'none';
    document.getElementById('p-ya').style.display = 'flex';
  }

  // Escuchar cambio de ronda (cuando el admin resetea)
  db.ref('encuesta/ronda').on('value', snap => {
    const nuevaRonda = snap.val() || 1;
    if (nuevaRonda !== rondaActual) {
      rondaActual = nuevaRonda;
      // Ronda nueva → habilitar votación de nuevo
      document.getElementById('p-main').style.display = 'flex';
      document.getElementById('p-ya').style.display = 'none';
      document.getElementById('p-ok').style.display = 'none';
      document.getElementById('btn-si').disabled = false;
      document.getElementById('btn-no').disabled = false;
    }
  });
}
iniciar();

async function votar(opcion) {
  const claveRonda = 'fm_voto_r' + rondaActual;
  if (localStorage.getItem(claveRonda)) {
    document.getElementById('p-main').style.display = 'none';
    document.getElementById('p-ya').style.display = 'flex';
    return;
  }

  const token = getToken() + '_r' + rondaActual;
  document.getElementById('loading').style.display = 'flex';
  document.getElementById('btn-si').disabled = true;
  document.getElementById('btn-no').disabled = true;

  try {
    const snap = await db.ref(`encuesta/votantes/${token}`).once('value');
    if (snap.exists()) {
      localStorage.setItem(claveRonda, '1');
      document.getElementById('loading').style.display = 'none';
      document.getElementById('p-main').style.display = 'none';
      document.getElementById('p-ya').style.display = 'flex';
      return;
    }

    const ts = Date.now();
    const updates = {};
    updates[`encuesta/votos/${opcion}`] = firebase.database.ServerValue.increment(1);
    updates['encuesta/votos/total'] = firebase.database.ServerValue.increment(1);
    updates[`encuesta/votantes/${token}`] = true;
    updates[`encuesta/historial/v${ts}`] = { voto: opcion, ts };
    await db.ref().update(updates);

    localStorage.setItem(claveRonda, '1');
    document.getElementById('loading').style.display = 'none';
    mostrarOk(opcion);

  } catch(e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('btn-si').disabled = false;
    document.getElementById('btn-no').disabled = false;
    alert('Error de conexión. Verifica tu internet e intenta de nuevo.');
  }
}

function mostrarOk(opcion) {
  const ok = document.getElementById('p-ok');
  ok.className = opcion === 'si' ? 'si-bg' : 'no-bg';
  document.getElementById('ok-label').textContent = opcion === 'si' ? '✓ SÍ' : '✗ NO';
  document.getElementById('p-main').style.display = 'none';
  ok.style.display = 'flex';
}
</script>
</body>
</html>
