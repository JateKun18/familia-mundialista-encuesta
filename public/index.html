<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>Familia Mundialista — VOTA</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Exo+2:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100vw; height: 100vh;
  overflow: hidden;
  font-family: 'Exo 2', sans-serif;
  background: #001233;
  color: #fff;
  position: relative;
}

/* ══ FONDO ESTADIO ══ */
.fondo {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 120% 60% at 50% 110%, rgba(0,80,20,0.55) 0%, transparent 60%),
    radial-gradient(ellipse 80% 40% at 20% 0%, rgba(204,0,0,0.18) 0%, transparent 50%),
    radial-gradient(ellipse 60% 50% at 80% 0%, rgba(255,215,0,0.10) 0%, transparent 50%),
    linear-gradient(175deg, #000d22 0%, #001840 35%, #002D6B 65%, #001233 100%);
}

/* Líneas de campo (decoración) */
.campo-lines {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  opacity: 0.06;
  background:
    repeating-linear-gradient(90deg, transparent, transparent 119px, rgba(255,255,255,0.8) 120px),
    linear-gradient(180deg, transparent 60%, rgba(255,255,255,0.4) 60%, rgba(255,255,255,0.4) 61%, transparent 61%);
}

/* Luces de estadio */
.luces {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background:
    radial-gradient(ellipse 30% 20% at 10% 0%, rgba(255,230,100,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 30% 20% at 90% 0%, rgba(255,230,100,0.12) 0%, transparent 70%),
    radial-gradient(ellipse 20% 15% at 50% 0%, rgba(255,255,255,0.06) 0%, transparent 70%);
}

/* ══ CANVAS BALONES ══ */
#bg-canvas { position: fixed; inset: 0; z-index: 2; pointer-events: none; }

/* ══ LAYOUT PRINCIPAL ══ */
.layout {
  position: relative; z-index: 10;
  display: grid;
  grid-template-columns: 1fr 280px;
  grid-template-rows: 140px 1fr auto;
  height: 100vh;
  gap: 0;
}

/* ══ HEADER ══ */
.header {
  grid-column: 1/2; grid-row: 1;
  display: flex; align-items: center; gap: 20px;
  padding: 0 44px;
  background: linear-gradient(90deg, rgba(0,13,34,0.9) 0%, rgba(0,13,34,0.7) 80%, transparent 100%);
  border-bottom: 2px solid rgba(255,215,0,0.2);
  position: relative;
}
.header::after {
  content: '';
  position: absolute; bottom: -2px; left: 0;
  width: 60%; height: 2px;
  background: linear-gradient(90deg, #FFD700, #FF8C00, transparent);
}

.logo-familia {
  font-family: 'Bebas Neue', sans-serif;
  line-height: 0.9;
}
.logo-familia .linea1 { font-size: 3.8rem; color: #fff; letter-spacing: 2px; text-shadow: 0 0 30px rgba(255,255,255,0.3); }
.logo-familia .linea2 { font-size: 3.8rem; color: #FFD700; letter-spacing: 2px; text-shadow: 0 0 30px rgba(255,215,0,0.5); }
.logo-familia .badge {
  display: inline-block;
  background: #CC0000;
  padding: 3px 16px 2px;
  border-radius: 6px;
  font-size: 1.6rem;
  letter-spacing: 5px;
  margin-top: 2px;
  box-shadow: 0 4px 20px rgba(204,0,0,0.5);
}

.header-divider {
  width: 3px; height: 80px;
  background: linear-gradient(180deg, transparent, #FFD700, transparent);
  margin: 0 6px;
}

.header-info { display: flex; flex-direction: column; gap: 4px; }
.header-balon { font-size: 3.5rem; animation: rodar 3s linear infinite; display: inline-block; }
@keyframes rodar { to { transform: rotate(360deg); } }
.live-badge {
  display: flex; align-items: center; gap: 6px;
  background: rgba(46,204,113,0.15); border: 1px solid rgba(46,204,113,0.4);
  border-radius: 20px; padding: 4px 14px;
  font-size: 0.72rem; font-weight: 700; letter-spacing: 2px; color: #2ECC71;
}
.live-dot { width: 7px; height: 7px; background: #2ECC71; border-radius: 50%; animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }

/* ══ QR PANEL ══ */
.qr-panel {
  grid-column: 2/3; grid-row: 1/4;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 20px 24px;
  background: linear-gradient(180deg, rgba(0,13,34,0.85) 0%, rgba(0,20,50,0.95) 100%);
  border-left: 1px solid rgba(255,215,0,0.15);
  gap: 16px;
}
.qr-titulo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem; letter-spacing: 4px; color: #FFD700;
  text-align: center; text-shadow: 0 0 20px rgba(255,215,0,0.5);
}
.qr-subtitulo { font-size: 0.72rem; color: rgba(255,255,255,0.5); text-align: center; letter-spacing: 1px; }
.qr-box {
  background: #fff; border-radius: 18px; padding: 14px;
  border: 4px solid #FFD700;
  box-shadow: 0 0 0 6px rgba(255,215,0,0.15), 0 0 60px rgba(255,215,0,0.4), 0 0 120px rgba(255,215,0,0.15);
  animation: pulsarQR 2.5s ease-in-out infinite;
}
@keyframes pulsarQR {
  0%,100% { box-shadow: 0 0 0 6px rgba(255,215,0,0.15), 0 0 60px rgba(255,215,0,0.4); }
  50% { box-shadow: 0 0 0 10px rgba(255,215,0,0.25), 0 0 100px rgba(255,215,0,0.7); }
}
#qr-img { display: block; width: 195px; height: 195px; border-radius: 10px; }
.qr-instruc {
  font-size: 0.78rem; color: rgba(255,255,255,0.65); text-align: center; line-height: 1.6; max-width: 200px;
}
.qr-url { font-size: 0.6rem; color: rgba(255,215,0,0.35); text-align: center; word-break: break-all; max-width: 210px; }

.qr-divider { width: 80%; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,215,0,0.3), transparent); }

.qr-total-label { font-family: 'Bebas Neue', sans-serif; font-size: 0.85rem; letter-spacing: 3px; color: rgba(255,255,255,0.35); text-transform: uppercase; }
.qr-total-num { font-family: 'Bebas Neue', sans-serif; font-size: 3.5rem; color: #FFD700; letter-spacing: 2px; text-shadow: 0 0 30px rgba(255,215,0,0.6); text-align: center; line-height: 1; }
.qr-total-sub { font-size: 0.68rem; color: rgba(255,255,255,0.3); letter-spacing: 2px; text-align: center; }

/* ══ PREGUNTA ══ */
.pregunta-section {
  grid-column: 1/2; grid-row: 2;
  display: flex; flex-direction: column; justify-content: center;
  padding: 16px 44px 8px;
}
.pregunta-eyebrow {
  font-size: 0.72rem; color: #FFD700; letter-spacing: 5px; font-weight: 700;
  text-transform: uppercase; margin-bottom: 10px; opacity: 0.7;
  display: flex; align-items: center; gap: 10px;
}
.pregunta-eyebrow::before, .pregunta-eyebrow::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(255,215,0,0.4), transparent);
}
.pregunta-eyebrow::after { background: linear-gradient(90deg, transparent, rgba(255,215,0,0.4)); }

.pregunta-txt {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 4rem; line-height: 1.02; letter-spacing: 2px;
  text-shadow: 0 4px 30px rgba(0,0,0,0.8), 0 0 60px rgba(255,215,0,0.1);
  max-width: 900px;
}
.pregunta-txt .ecuador { color: #FFD700; text-shadow: 0 0 30px rgba(255,215,0,0.6); }

/* ══ BARRAS ══ */
.barras-section {
  grid-column: 1/2; grid-row: 3;
  padding: 8px 44px 28px;
  display: flex; flex-direction: column; gap: 14px;
}

.voto-row { display: flex; align-items: center; gap: 20px; }

.voto-icon {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem; letter-spacing: 2px;
  text-align: center; min-width: 72px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.voto-icon .icono { font-size: 2.2rem; }
.voto-icon .texto { font-size: 2rem; letter-spacing: 3px; }
.voto-icon.si .texto { color: #2ECC71; text-shadow: 0 0 20px rgba(46,204,113,0.8); }
.voto-icon.no .texto { color: #E74C3C; text-shadow: 0 0 20px rgba(231,76,60,0.8); }

.barra-outer { flex: 1; position: relative; }

.barra-track {
  height: 86px; border-radius: 50px;
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,255,255,0.08);
  overflow: visible; position: relative;
}

.barra-fill {
  height: 100%; border-radius: 50px;
  transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
  width: 0%; min-width: 0;
  position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: flex-end;
  padding-right: 18px;
}
/* Brillo interno */
.barra-fill::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 45%;
  background: rgba(255,255,255,0.15); border-radius: 50px 50px 0 0;
}

.si-bar {
  background: linear-gradient(90deg, #0f5e2f 0%, #1e8f4a 30%, #27AE60 60%, #52d68a 85%, #FFE55C 100%);
  box-shadow: 0 0 40px rgba(46,204,113,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
}
.no-bar {
  background: linear-gradient(90deg, #6b1010 0%, #a02020 30%, #CC0000 60%, #E74C3C 85%, #ff8c8c 100%);
  box-shadow: 0 0 40px rgba(204,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.2);
}

.barra-balon {
  font-size: 2.2rem;
  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.6));
  animation: rebote 0.7s ease-in-out infinite alternate;
  flex-shrink: 0; position: relative; z-index: 1;
}
@keyframes rebote { from{transform:scale(1) rotate(-5deg)} to{transform:scale(1.18) rotate(5deg)} }

.barra-pct {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  font-family: 'Bebas Neue', sans-serif; font-size: 2.6rem;
  color: rgba(255,255,255,0.95); text-shadow: 0 2px 10px rgba(0,0,0,0.8);
  z-index: 5; pointer-events: none; letter-spacing: 2px;
  white-space: nowrap;
}

.barra-count {
  font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem;
  min-width: 100px; letter-spacing: 2px; color: rgba(255,255,255,0.6);
  text-align: right;
}
.barra-count span { font-size: 0.68rem; font-family:'Exo 2',sans-serif; font-weight:700; letter-spacing:1px; color:rgba(255,255,255,0.3); display:block; text-align:right; }

/* ══ PARTÍCULAS AL VOTAR ══ */
.burst { position: fixed; bottom: 80px; pointer-events: none; z-index: 200; font-size: 3rem; animation: vuelo 3s ease-out forwards; }
@keyframes vuelo { 0%{transform:translateY(0) scale(0.4) rotate(-15deg);opacity:1} 15%{transform:translateY(-70px) scale(1.15) rotate(8deg);opacity:1} 100%{transform:translateY(-640px) scale(0.5) rotate(50deg);opacity:0} }

.plus { position:fixed; font-family:'Bebas Neue',sans-serif; font-size:2.6rem; pointer-events:none; z-index:300; animation:masUno 1.3s ease-out forwards; }
.plus.si{color:#2ECC71;text-shadow:0 0 20px rgba(46,204,113,0.9);}
.plus.no{color:#E74C3C;text-shadow:0 0 20px rgba(231,76,60,0.9);}
@keyframes masUno{0%{transform:translateY(0) scale(0.8);opacity:1}100%{transform:translateY(-130px) scale(1.3);opacity:0}}

.barra-flash { animation: flashBarra 0.45s ease-out; }
@keyframes flashBarra{0%,100%{filter:brightness(1)}50%{filter:brightness(1.8)}}

/* ══ MILESTONE ══ */
.milestone { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0); z-index:500; background:linear-gradient(135deg,#FFD700,#FF6B00); color:#001233; font-family:'Bebas Neue',sans-serif; font-size:4.2rem; padding:22px 70px; border-radius:22px; text-align:center; box-shadow:0 0 100px rgba(255,215,0,0.9); letter-spacing:4px; display:none; }
.milestone.show{display:block;animation:milAnim 3.3s ease-in-out forwards;}
@keyframes milAnim{0%{transform:translate(-50%,-50%) scale(0)}15%{transform:translate(-50%,-50%) scale(1.12)}25%{transform:translate(-50%,-50%) scale(1)}80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(0.8);opacity:0}}
</style>
</head>
<body>

<!-- Fondos -->
<div class="fondo"></div>
<div class="campo-lines"></div>
<div class="luces"></div>
<canvas id="bg-canvas"></canvas>

<div class="layout">

  <!-- HEADER -->
  <div class="header">
    <div class="logo-familia">
      <div class="linea1">Fa<span style="color:#FFD700">m</span>i</div>
      <div class="linea2">lia</div>
      <div class="badge">MUNDIALISTA</div>
    </div>
    <div class="header-divider"></div>
    <div class="header-balon">⚽</div>
    <div class="header-divider"></div>
    <div class="header-info">
      <div class="live-badge"><span class="live-dot"></span>EN VIVO</div>
      <div style="font-size:0.7rem;color:rgba(255,255,255,0.35);letter-spacing:2px;margin-top:4px;">ENCUESTA INTERACTIVA</div>
    </div>
  </div>

  <!-- QR PANEL -->
  <div class="qr-panel">
    <div class="qr-titulo">📱 ESCANEA Y VOTA</div>
    <div class="qr-subtitulo">Con la cámara de tu celular</div>
    <div class="qr-box">
      <img id="qr-img" src="" alt="QR" width="195" height="195">
    </div>
    <div class="qr-instruc">Abre la cámara · Escanea · Elige SI o NO</div>
    <div class="qr-url" id="qr-url"></div>
    <div class="qr-divider"></div>
    <div class="qr-total-label">Total de votos</div>
    <div class="qr-total-num" id="total-num">0</div>
    <div class="qr-total-sub">PARTICIPANTES</div>
    <div style="font-size:1.8rem;letter-spacing:8px;margin-top:4px;">⚽⚽⚽</div>
  </div>

  <!-- PREGUNTA -->
  <div class="pregunta-section">
    <div class="pregunta-eyebrow">⚡ La pregunta del día ⚡</div>
    <div class="pregunta-txt">
      ¿QUISIERAS VER EL PARTIDO DE <span class="ecuador">ECUADOR</span> EN LA PANTALLA GRANDE?
    </div>
  </div>

  <!-- BARRAS -->
  <div class="barras-section">

    <div class="voto-row">
      <div class="voto-icon si">
        <span class="icono">✅</span>
        <span class="texto">SÍ</span>
      </div>
      <div class="barra-outer">
        <div class="barra-track" id="track-si">
          <div class="barra-fill si-bar" id="fill-si">
            <span class="barra-balon">⚽</span>
          </div>
          <div class="barra-pct" id="pct-si">–</div>
        </div>
      </div>
      <div class="barra-count" id="cnt-si">0<span>votos</span></div>
    </div>

    <div class="voto-row">
      <div class="voto-icon no">
        <span class="icono">❌</span>
        <span class="texto">NO</span>
      </div>
      <div class="barra-outer">
        <div class="barra-track" id="track-no">
          <div class="barra-fill no-bar" id="fill-no">
            <span class="barra-balon">⚽</span>
          </div>
          <div class="barra-pct" id="pct-no">–</div>
        </div>
      </div>
      <div class="barra-count" id="cnt-no">0<span>votos</span></div>
    </div>

  </div>

</div>

<div class="milestone" id="milestone"></div>

<script>
// ═══════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyC4hi8x8U6kRzeaTZXd1_Yb5lK4axwHHNI",
  authDomain: "familia-encuesta-mundial.firebaseapp.com",
  databaseURL: "https://familia-encuesta-mundial-default-rtdb.firebaseio.com",
  projectId: "familia-encuesta-mundial",
  storageBucket: "familia-encuesta-mundial.firebasestorage.app",
  messagingSenderId: "682913863910",
  appId: "1:682913863910:web:d228b84bbe92edf82b8327"
};
// ═══════════════════════════════════════

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// QR
(function(){
  const url = window.location.origin + '/votar';
  document.getElementById('qr-url').textContent = url;
  document.getElementById('qr-img').src =
    `https://api.qrserver.com/v1/create-qr-code/?size=195x195&data=${encodeURIComponent(url)}&color=001233&bgcolor=ffffff&margin=8`;
})();

// Canvas balones de fondo
(function(){
  const cv = document.getElementById('bg-canvas');
  const ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const balls = Array.from({length:28}, () => ({
    x: Math.random()*innerWidth, y: innerHeight + Math.random()*innerHeight,
    size: 12+Math.random()*24, speed: 0.25+Math.random()*0.65,
    rot: Math.random()*Math.PI*2, rotS: (Math.random()-0.5)*0.025,
    op: 0.04+Math.random()*0.1
  }));
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    balls.forEach(b=>{
      b.y-=b.speed; b.rot+=b.rotS;
      if(b.y<-60){b.y=cv.height+20;b.x=Math.random()*cv.width;}
      ctx.save();ctx.globalAlpha=b.op;ctx.font=`${b.size}px serif`;
      ctx.translate(b.x,b.y);ctx.rotate(b.rot);
      ctx.fillText('⚽',-b.size/2,b.size/2);ctx.restore();
    });
    requestAnimationFrame(draw);
  }
  draw();
  addEventListener('resize',()=>{cv.width=innerWidth;cv.height=innerHeight;});
})();

let prevTotal = 0;
const milestones = new Set([25,50,100,150,200,300,500]);

function actualizar(data){
  const si = data.si||0, no = data.no||0, total = data.total||0;
  const pSi = total>0?Math.round(si/total*100):0;
  const pNo = total>0?Math.round(no/total*100):0;

  document.getElementById('fill-si').style.width = Math.max(pSi,1.5)+'%';
  document.getElementById('fill-no').style.width = Math.max(pNo,1.5)+'%';
  document.getElementById('pct-si').textContent = total>0?pSi+'%':'–';
  document.getElementById('pct-no').textContent = total>0?pNo+'%':'–';
  document.getElementById('cnt-si').innerHTML = si+'<span>votos</span>';
  document.getElementById('cnt-no').innerHTML = no+'<span>votos</span>';
  document.getElementById('total-num').textContent = total;

  if(total>prevTotal){
    const tipo = data.ultimoVoto||(si>=no?'si':'no');
    spawnBurst(tipo); spawnPlus(tipo); flashBarra(tipo);
    if(milestones.has(total)) celebrar(total);
  }
  prevTotal = total;
}

function spawnBurst(tipo){
  const n = Math.random()<0.25?3:1;
  for(let i=0;i<n;i++) setTimeout(()=>{
    const el=document.createElement('div');
    el.className='burst';
    el.textContent='⚽';
    el.style.left=(8+Math.random()*75)+'%';
    el.style.fontSize=(2.2+Math.random()*2.2)+'rem';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3200);
  },i*180);
}

function spawnPlus(tipo){
  const el=document.createElement('div');
  el.className='plus '+tipo; el.textContent='+1';
  const ref=document.getElementById('track-'+tipo);
  if(!ref)return;
  const r=ref.getBoundingClientRect();
  el.style.left=(r.left+30+Math.random()*r.width*0.5)+'px';
  el.style.top=(r.top+r.height/2)+'px';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1400);
}

function flashBarra(tipo){
  const el=document.getElementById('track-'+tipo);
  if(!el)return;
  el.classList.remove('barra-flash'); void el.offsetWidth;
  el.classList.add('barra-flash');
  setTimeout(()=>el.classList.remove('barra-flash'),500);
}

function celebrar(n){
  const m=document.getElementById('milestone');
  m.textContent=`🎉 ¡${n} VOTOS! 🎉`;
  m.className='milestone show';
  for(let i=0;i<16;i++) setTimeout(()=>spawnBurst('si'),i*60);
  setTimeout(()=>m.className='milestone',3500);
}

db.ref('encuesta/votos').on('value', snap=>{
  actualizar(snap.val()||{si:0,no:0,total:0});
});
</script>
</body>
</html>
